{% extends "layout.html" %}

{% block title %}
家庭設定 | Disaster Builder
{% endblock %}

{% block content %}

<div class="page-heading">

    <h1>家庭設定</h1>

    <p>
        家族構成や備蓄条件を設定します。
        設定内容は必要な防災用品の計算に反映されます。
    </p>

</div>

<form id="settings-form" class="settings-section">

    <div class="card">

        <h2>家族構成</h2>

        <div class="form-grid">

            <div class="form-field">
                <label for="adults">大人の人数</label>
                <input id="adults" type="number"
                       min="0" max="30" required>
            </div>

            <div class="form-field">
                <label for="children">子供の人数</label>
                <input id="children" type="number"
                       min="0" max="30" required>
            </div>

            <div class="form-field">
                <label for="pets">ペットの数</label>
                <input id="pets" type="number"
                       min="0" max="30" required>
            </div>

            <div class="form-field">
                <label for="infants">うち乳幼児</label>
                <input id="infants" type="number"
                       min="0" max="30" required>
            </div>

            <div class="form-field">
                <label for="seniors">うち高齢者</label>
                <input id="seniors" type="number"
                       min="0" max="30" required>
            </div>

        </div>

    </div>


    <div class="card">

        <h2>備蓄条件</h2>

        <div class="form-grid">

            <div class="form-field">

                <label for="days">自宅備蓄日数</label>

                <input id="days" type="number"
                       min="1" max="30" required>

            </div>

            <div class="form-field">

                <label for="go_days">非常持ち出し日数</label>

                <select id="go_days">
                    <option value="1">1日分</option>
                    <option value="2">2日分</option>
                    <option value="3">3日分</option>
                </select>

            </div>

        </div>

    </div>


    <div class="card">

        <h2>非常持ち出し条件</h2>

        <div class="form-grid">

            <div class="form-field">

                <label for="backpack_capacity">
                    リュック合計容量（L）
                </label>

                <input id="backpack_capacity"
                       type="number"
                       min="0.1" max="1000"
                       step="0.1" required>

            </div>

            <div class="form-field">

                <label for="max_carry_weight">
                    持ち出し重量上限（kg）
                </label>

                <input id="max_carry_weight"
                       type="number"
                       min="0.1" max="500"
                       step="0.1" required>

            </div>

        </div>

    </div>

    <p id="page-error" class="error"></p>

    <div class="form-actions">

        <a href="/" class="button button-outline">
            キャンセル
        </a>

        <button type="submit" class="button">
            設定を保存
        </button>

    </div>

</form>

{% endblock %}
